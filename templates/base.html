<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}智能电表全周期质量管控系统{% endblock %}</title>
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.min.css">
  <!-- ECharts -->
  <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
  <style>
    :root {
      --sidebar-width: 240px;
      --primary: #1a3a5c;
      --primary-light: #2d5986;
      --accent: #f0a500;
      --accent2: #e74c3c;
      --success: #27ae60;
      --bg: #f4f6fb;
      --sidebar-bg: #1a3a5c;
      --sidebar-text: #c8d8ea;
      --card-shadow: 0 2px 12px rgba(26,58,92,0.10);
    }
    body { background: var(--bg); font-family: 'Segoe UI', 'PingFang SC', sans-serif; margin: 0; }

    /* ── 侧边栏 ── */
    #sidebar {
      position: fixed; top: 0; left: 0; height: 100vh; width: var(--sidebar-width);
      background: var(--sidebar-bg); z-index: 100; display: flex; flex-direction: column;
      box-shadow: 2px 0 16px rgba(0,0,0,0.18);
    }
    .sidebar-brand {
      padding: 24px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-brand .title { color: #fff; font-size: 15px; font-weight: 700; line-height: 1.3; margin: 0; }
    .sidebar-brand .subtitle { color: var(--sidebar-text); font-size: 11px; margin-top: 4px; }
    .sidebar-logo { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    .sidebar-logo i { color: #fff; font-size: 18px; }

    .sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
    .nav-section-title { color: rgba(200,216,234,0.5); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding: 8px 20px 4px; }
    .nav-link-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; color: var(--sidebar-text); text-decoration: none; border-radius: 0;
      font-size: 14px; transition: all 0.2s;
    }
    .nav-link-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-link-item.active { background: var(--accent); color: #fff; }
    .nav-link-item i { font-size: 16px; min-width: 20px; }

    .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.08); color: var(--sidebar-text); font-size: 11px; }

    /* ── 主内容区 ── */
    #main { margin-left: var(--sidebar-width); min-height: 100vh; }
    .topbar {
      background: #fff; border-bottom: 1px solid #e3e8f0; padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 8px rgba(26,58,92,0.06);
    }
    .topbar-title { font-size: 18px; font-weight: 600; color: var(--primary); margin: 0; }
    .topbar-badge { background: var(--accent); color: #fff; font-size: 11px; padding: 2px 10px; border-radius: 20px; }
    .content { padding: 28px; }

    /* ── 卡片 ── */
    .card { border: none; border-radius: 12px; box-shadow: var(--card-shadow); }
    .card-header { border-radius: 12px 12px 0 0 !important; border-bottom: 1px solid rgba(0,0,0,0.06); font-weight: 600; padding: 14px 20px; }
    .card-header.primary { background: var(--primary); color: #fff; }

    /* ── KPI 卡片 ── */
    .kpi-card {
      background: #fff; border-radius: 12px; padding: 20px 22px;
      box-shadow: var(--card-shadow); position: relative; overflow: hidden;
    }
    .kpi-card .kpi-icon {
      width: 48px; height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff;
    }
    .kpi-card .kpi-value { font-size: 32px; font-weight: 700; color: var(--primary); line-height: 1.1; }
    .kpi-card .kpi-label { font-size: 13px; color: #7a8fa6; margin-top: 4px; }
    .kpi-card .kpi-bg { position: absolute; right: -10px; bottom: -10px; font-size: 80px; color: rgba(26,58,92,0.04); }

    /* ── 状态徽章 ── */
    .badge-risk-high { background: #fdecea; color: #c0392b; font-weight: 600; border-radius: 6px; padding: 3px 10px; }
    .badge-risk-low { background: #e8f8f0; color: #1e8449; font-weight: 600; border-radius: 6px; padding: 3px 10px; }
    .badge-risk-mid { background: #fef9e7; color: #b7770d; font-weight: 600; border-radius: 6px; padding: 3px 10px; }

    /* ── 表格 ── */
    .table th { font-size: 13px; font-weight: 600; color: #5a6a7a; background: #f8fafc; }
    .table td { font-size: 13px; vertical-align: middle; }
    .table-hover tbody tr:hover { background: #eef4ff; }

    /* ── 进度条 ── */
    .risk-bar { height: 8px; border-radius: 4px; overflow: hidden; background: #e3e8f0; }
    .risk-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s; }

    /* ── 图表容器 ── */
    .chart-box { border-radius: 10px; background: #fff; padding: 16px; }

    /* ── 按钮 ── */
    .btn-primary { background: var(--primary); border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-light); border-color: var(--primary-light); }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-accent:hover { background: #d4920a; color: #fff; }

    /* ── 加载动画 ── */
    .spinner-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; }
    .spinner-overlay.show { display: flex; }

    /* ── 响应式 ── */
    @media (max-width: 768px) {
      #sidebar { width: 60px; }
      .nav-link-item span, .sidebar-brand .title, .sidebar-brand .subtitle, .nav-section-title, .sidebar-footer { display: none; }
      #main { margin-left: 60px; }
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<!-- 侧边栏 -->
<nav id="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-logo"><i class="bi bi-lightning-charge"></i></div>
    <p class="title">智能电表<br>质量管控系统</p>
    <p class="subtitle">AI Quality Management</p>
  </div>

  <div class="sidebar-nav">
    <div class="nav-section-title">主要功能</div>
    <a href="/dashboard" class="nav-link-item {% if page == 'dashboard' %}active{% endif %}">
      <i class="bi bi-grid-1x2"></i><span>质量看板</span>
    </a>
    <a href="/import" class="nav-link-item {% if page == 'import' %}active{% endif %}">
      <i class="bi bi-cloud-upload"></i><span>数据导入</span>
    </a>
    <a href="/predict" class="nav-link-item {% if page == 'predict' %}active{% endif %}">
      <i class="bi bi-shield-check"></i><span>风险预测</span>
    </a>
    <a href="/rootcause" class="nav-link-item {% if page == 'rootcause' %}active{% endif %}">
      <i class="bi bi-search"></i><span>根因追溯</span>
    </a>

    <div class="nav-section-title" style="margin-top:12px;">分析模块</div>
    <a href="/degradation" class="nav-link-item {% if page == 'degradation' %}active{% endif %}">
      <i class="bi bi-graph-down"></i><span>退化分析</span>
    </a>
    <a href="/anomaly" class="nav-link-item {% if page == 'anomaly' %}active{% endif %}">
      <i class="bi bi-exclamation-triangle"></i><span>异常检测</span>
    </a>
  </div>

  <div class="sidebar-footer">
    <i class="bi bi-cpu"></i> v1.0.0 &nbsp;|&nbsp; 浙江大学
  </div>
</nav>

<!-- 主内容区 -->
<div id="main">
  <div class="topbar">
    <h1 class="topbar-title">{% block page_title %}质量管控{% endblock %}</h1>
    <div class="d-flex align-items-center gap-3">
      {% block topbar_actions %}{% endblock %}
      <span class="topbar-badge"><i class="bi bi-activity"></i> 在线</span>
    </div>
  </div>

  <div class="content">
    {% block content %}{% endblock %}
  </div>
</div>

<!-- 加载遮罩 -->
<div class="spinner-overlay" id="loadingOverlay">
  <div class="spinner-border text-primary" role="status" style="width:48px;height:48px;"></div>
  <p style="margin-top:16px;color:#1a3a5c;font-weight:600;" id="loadingText">处理中，请稍候...</p>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script>
function showLoading(text) {
  document.getElementById('loadingText').textContent = text || '处理中，请稍候...';
  document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('show');
}

async function postJson(url, data) {
  const resp = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  });
  return resp.json();
}

function riskBadge(label, prob) {
  if (label == 1 || prob >= 0.7) return '<span class="badge-risk-high">高风险</span>';
  if (prob >= 0.4) return '<span class="badge-risk-mid">中风险</span>';
  return '<span class="badge-risk-low">正常</span>';
}
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
